name: BCH Alpha Hunter Daily Engine

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run-alpha-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install notebook nbconvert pandas numpy scipy openpyxl yfinance requests beautifulsoup4 lxml html5lib

      - name: Repair Notebook Format
        run: |
          python - <<'PY'
          import json

          path = "BCH_Alpha_Hunter_Engine_GitHub_Ready.ipynb"

          with open(path, "r", encoding="utf-8") as f:
              nb = json.load(f)

          for cell in nb.get("cells", []):
              if cell.get("cell_type") == "code":
                  cell.setdefault("outputs", [])
                  cell.setdefault("execution_count", None)

          with open(path, "w", encoding="utf-8") as f:
              json.dump(nb, f)

          print("Notebook repaired.")
          PY

      - name: Execute Alpha Hunter Notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute BCH_Alpha_Hunter_Engine_GitHub_Ready.ipynb \
            --output BCH_Alpha_Hunter_Output.ipynb \
            --ExecutePreprocessor.timeout=900

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: BCH-Alpha-Hunter-Daily-Reports
          path: |
            *.csv
            *.xlsx
            *.json
            *.html
            BCH_Alpha_Hunter_Output.ipynb

      - name: Create Dashboard Folder
        run: |
          mkdir -p public

          cp BCH_Alpha_Hunter_Dashboard.csv public/ || true
          cp BCH_Alpha_Hunter_Top20.csv public/ || true
          cp BCH_Alpha_Hunter_Results.csv public/ || true
          cp BCH_Alpha_Hunter_Metadata.json public/ || true

      - name: Create Dashboard HTML
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          dashboard_html = "<p>No dashboard data available.</p>"
          top20_html = "<p>No Top20 data available.</p>"

          if Path("BCH_Alpha_Hunter_Dashboard.csv").exists():
              dashboard = pd.read_csv("BCH_Alpha_Hunter_Dashboard.csv")
              dashboard_html = dashboard.to_html(index=False)

          if Path("BCH_Alpha_Hunter_Top20.csv").exists():
              top20 = pd.read_csv("BCH_Alpha_Hunter_Top20.csv")
              top20_html = top20.to_html(index=False)

          html = f"""
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>BCH Alpha Hunter Dashboard</title>

            <style>
              body {{
                background:#0f172a;
                color:white;
                font-family:Arial, sans-serif;
                padding:30px;
              }}

              h1 {{
                color:#38bdf8;
              }}

              h2 {{
                color:#facc15;
              }}

              table {{
                width:100%;
                border-collapse:collapse;
                background:#111827;
              }}

              th {{
                background:#1e293b;
                color:#93c5fd;
                padding:8px;
              }}

              td {{
                border:1px solid #334155;
                padding:8px;
              }}

              .card {{
                background:#111827;
                padding:20px;
                margin-bottom:20px;
                border-radius:10px;
              }}

              a {{
                color:#38bdf8;
              }}
            </style>
          </head>

          <body>

            <h1>BCH Alpha Hunter Dashboard</h1>

            <div class="card">
              <h2>Command Metrics</h2>
              {dashboard_html}
            </div>

            <div class="card">
              <h2>Top 20 Opportunities</h2>
              {top20_html}
            </div>

            <div class="card">
              <h2>Downloads</h2>

              <a href="BCH_Alpha_Hunter_Dashboard.csv">
                Dashboard CSV
              </a>

              <br><br>

              <a href="BCH_Alpha_Hunter_Top20.csv">
                Top20 CSV
              </a>

              <br><br>

              <a href="BCH_Alpha_Hunter_Results.csv">
                Full Results CSV
              </a>
            </div>

          </body>
          </html>
          """

          Path("public/index.html").write_text(
              html,
              encoding="utf-8"
          )
          PY

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: run-alpha-hunter

    runs-on: ubuntu-latest

    environment:
      name: github-pages

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
