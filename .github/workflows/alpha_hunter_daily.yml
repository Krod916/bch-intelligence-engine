name: BCH Alpha Hunter Daily Engine

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  run-alpha-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install notebook nbconvert pandas numpy scipy openpyxl yfinance requests beautifulsoup4 lxml html5lib

      - name: Repair Notebook Format
        run: |
          python - <<'PY'
          import json

          path = "BCH_Alpha_Hunter_Engine_GitHub_Ready.ipynb"

          with open(path, "r", encoding="utf-8") as f:
              nb = json.load(f)

          for cell in nb.get("cells", []):
              if cell.get("cell_type") == "code":
                  cell.setdefault("outputs", [])
                  cell.setdefault("execution_count", None)

          with open(path, "w", encoding="utf-8") as f:
              json.dump(nb, f)

          print("Notebook format repaired.")
          PY

      - name: Execute Alpha Hunter Notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute BCH_Alpha_Hunter_Engine_GitHub_Ready.ipynb \
            --output BCH_Alpha_Hunter_Output.ipynb \
            --ExecutePreprocessor.timeout=900

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: BCH-Alpha-Hunter-Daily-Reports
          path: |
            *.csv
            *.xlsx
            *.json
            *.html
            BCH_Alpha_Hunter_Output.ipynb
      - name: Create Dashboard Folder
        run: |
          mkdir -p public
          cp BCH_Alpha_Hunter_Dashboard.csv public/
          cp BCH_Alpha_Hunter_Top20.csv public/

           - name: Create Dashboard HTML
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          dashboard = pd.read_csv("BCH_Alpha_Hunter_Dashboard.csv")
          top20 = pd.read_csv("BCH_Alpha_Hunter_Top20.csv")

          metrics_html = dashboard.to_html(index=False, classes="table")
          top20_html = top20.to_html(index=False, classes="table")

          html = f"""
          <!DOCTYPE html>
          <html>
          <head>
            <title>BCH Alpha Hunter Dashboard</title>
            <style>
              body {{ font-family: Arial, sans-serif; background:#0f172a; color:#e5e7eb; padding:30px; }}
              h1 {{ color:#38bdf8; }}
              h2 {{ color:#facc15; margin-top:30px; }}
              .card {{ background:#111827; padding:20px; border-radius:12px; margin-bottom:25px; box-shadow:0 0 12px rgba(0,0,0,.35); }}
              .table {{ border-collapse:collapse; width:100%; font-size:14px; }}
              .table th {{ background:#1e293b; color:#93c5fd; padding:8px; }}
              .table td {{ border-bottom:1px solid #334155; padding:8px; }}
              a {{ color:#38bdf8; }}
            </style>
          </head>
          <body>
            <h1>BCH Alpha Hunter Dashboard</h1>

            <div class="card">
              <h2>Command Metrics</h2>
              {metrics_html}
            </div>

            <div class="card">
              <h2>Top 20 Alpha Opportunities</h2>
              {top20_html}
            </div>

            <div class="card">
              <h2>Raw Reports</h2>
              <a href="BCH_Alpha_Hunter_Dashboard.csv">Dashboard CSV</a><br>
              <a href="BCH_Alpha_Hunter_Top20.csv">Top20 CSV</a>
            </div>
          </body>
          </html>
          """

          Path("public/index.html").write_text(html, encoding="utf-8")
          PY

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: run-alpha-hunter
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
            
